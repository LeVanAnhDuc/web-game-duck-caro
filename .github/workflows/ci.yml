name: CI

# Chỉ chạy trên pull request. Push vào `main` đã được `deploy.yml` gác (typecheck +
# test + build) và `release.yml` gác lại một lần nữa trước khi tag, nên để CI chạy
# thêm ở đó là ba lần cùng một bộ test cho một cú push.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Static export builds
        run: yarn build
        env:
          GITHUB_PAGES: 'true'

      # NFR-SEC-05: dependency không có lỗ hổng mức high trở lên.
      # `|| true` là CỐ Ý và là nợ có ghi: yarn classic không có cờ lọc theo mức,
      # nên bước này hiện chỉ để BÁO, chưa chặn. Xem backlog.md §Nợ kỹ thuật.
      - name: Audit (báo, chưa chặn)
        run: yarn audit --level high || true

  # E2E tách thành job RIÊNG, chạy song song với `check`.
  #
  # Không gộp vào `check`: nó cần tải một trình duyệt (~150MB) và một lần build, nên gộp
  # lại sẽ làm cả typecheck và lint phải chờ khoản đó trước khi báo lỗi đầu tiên. Tách ra
  # thì một lỗi cú pháp vẫn đỏ trong một phút.
  #
  # `yarn build` do `playwright.config.ts` gọi trong `webServer` — E2E kiểm bản build
  # tĩnh, không kiểm dev server (ADR-0022).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      # Chỉ Chromium. Ba trình duyệt là ba lần thời gian CI cho một sản phẩm chưa có
      # người chơi thật — xem docs/specs/e2e-and-lighthouse/design.md §7.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: yarn e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
